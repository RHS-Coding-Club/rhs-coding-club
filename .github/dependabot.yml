version: 2
updates:
  # bun.lock needs the "bun" ecosystem; "npm" can't update it. Updates are
  # grouped so a week of bumps is one or two PRs. Merging one deploys the site.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    labels: [dependencies]
    # React Bits' AeroShards (the /blog hero) passes raw WGSL strings, which
    # vgpu 0.4 and later may reject (0.6 does). Drop this once its registry
    # entry asks for a newer vgpu.
    ignore:
      - dependency-name: vgpu
        versions: ['>=0.4.0']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]

  # Workflows pin actions to commit SHAs; this keeps the SHAs and their version
  # comments current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci(deps)
    labels: [dependencies, 'area: ci']
    groups:
      actions:
        patterns: ['*']
